# Vigilancia de cronogramas de cortes de luz (mismo modelo que el scraper de Mazar).
# Cada hora entre 6:00 y 22:00 de Ecuador (UTC-5), al minuto 7 (GitHub congestiona los
# cron en punto). Para cambiar la frecuencia, editar solo la línea `cron`. Hace commit de data/ y abre
# un issue cuando hay datos nuevos (código 10) o algo que revisar (código 20).
# El buscador en Xalok lee data/cortes_luz_publicado.json desde raw.githubusercontent.com.
name: Vigilar cortes de luz

on:
  schedule:
    - cron: "7 0-3,11-23 * * *"      # UTC: 11:07–23:07 y 00:07–03:07 = 6:07–22:07 en Ecuador
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: datos-cortes        # compartido con aprobar.yml: nunca escriben a la vez
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pasada de vigilancia
        id: vigilar
        run: |
          set +e
          python -m pipeline.vigilar
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: Guardar datos en el repositorio
        if: steps.vigilar.outputs.codigo != '2'
        run: |
          # GitHub desactiva los cron de repos públicos tras 60 días sin actividad:
          # si no hubo commits en 30 días, se deja un latido.
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u +%FT%TZ > data/latido.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/."
          else
            git commit -m "datos: vigilancia $(date -u +%F' '%H:%M) UTC (código ${{ steps.vigilar.outputs.codigo }})"
            git push
          fi

      - name: Avisar (un solo issue abierto; los avisos siguientes van como comentario)
        if: steps.vigilar.outputs.codigo == '10' || steps.vigilar.outputs.codigo == '20'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.vigilar.outputs.codigo }}" = "10" ]; then t="Datos nuevos"; else t="Revisión necesaria"; fi
          {
            echo "### $t · $(date -u +%F' '%H:%M) UTC"
            echo
            cat salida/vigilancia/alerta.md
            echo
            echo "---"
            echo "Para publicar el candidato: pestaña **Actions → Aprobar publicación → Run workflow**."
            echo "Alimentadores sin cantón: edita \`data/alimentadores_centrosur.csv\` (columnas canton y provincia)."
          } > cuerpo.md
          gh label create vigilancia --color 04A4DE --description "Avisos del scraper de cortes" 2>/dev/null || true
          abierto=$(gh issue list --label vigilancia --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body-file cuerpo.md
          else
            gh issue create --title "Cortes de luz · avisos de vigilancia" --label vigilancia --body-file cuerpo.md
          fi

      - name: Fallar si hubo error
        if: steps.vigilar.outputs.codigo == '2'
        run: exit 1
